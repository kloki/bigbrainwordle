[package]
name = "bigbrainwordle"
version = "0.3.1"
edition = "2024"

description = "A cli tool that helps you solve the daily wordle"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kloki/bigbrainwordle"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rand = "0.8.5"
ratatui = "0.28.1"
rayon = "1.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
